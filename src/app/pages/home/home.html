<main class="home-container">
  <header class="app-header">
    <h1>Welcome to Angular 20 App</h1>
    <nav>
      @for (item of listRoutes; track $index) {
        <button (click)="routerTo(item.path)">{{ item.label }}</button>
      }
    </nav>
  </header>

  <section class="hero">
    <h2>Building Modern Web Apps</h2>
    <p>Experience fast and reactive web development with Angular 20. Explore features, learn components, and enjoy responsive design!</p>
    <button (click)="window()">Who I’m?</button>
  </section>

</main>
